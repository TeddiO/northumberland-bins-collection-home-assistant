name: Pull Request

on:
  pull_request:

permissions: {}

jobs:
  build:
    name: Build container
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: home-assistant/go.mod
          cache-dependency-path: home-assistant/go.mod

      - name: Run tests
        working-directory: home-assistant
        run: go test ./...

      - name: Run vet
        working-directory: home-assistant
        run: go vet ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: home-assistant
        run: govulncheck ./...

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./home-assistant
          file: ./home-assistant/Dockerfile
          push: false